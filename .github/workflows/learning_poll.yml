name: V16 群消息轮询（云端备援·默认手动）

on:
  # V43 修正：本地 V16_LearningPoll 计划任务正常运行时云端自动触发会造成双重轮询，
  # 且云端缺少 BASE_TOKEN/CHAT_ID secrets、wrapper 为 Windows 硬编码路径（云端无法运行）。
  # 保留 workflow_dispatch 作本地故障时的手动备援；如需云端定时，请先解决 secrets 与脚本跨平台问题。
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:  # 支持手动触发

env:
  BASE_TOKEN: ${{ secrets.BASE_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
  LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}

jobs:
  learning-poll:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装lark-cli
        run: |
          npm install -g @larksuite/lark-cli
          lark-cli --version

      - name: 配置lark-cli
        run: |
          mkdir -p ~/.lark-cli
          cat > ~/.lark-cli/config.json << EOF
          {
            "app_id": "${{ secrets.LARK_APP_ID }}",
            "app_secret": "${{ secrets.LARK_APP_SECRET }}"
          }
          EOF

      - name: 运行群消息轮询
        run: |
          cd scripts
          python run_poll_wrapper.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poll-log
          path: scripts/task_python_debug.log
          retention-days: 7

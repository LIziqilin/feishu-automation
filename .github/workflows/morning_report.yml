name: V16 早报推送（云端永续·自动）

on:
  # P0-A 恢复（2026-10-23）：由 V43"注释停用"改为自动调度。
  # 错峰设计：本地 V16_MorningReport=07:30，云端=07:45（UTC 23:45），避免同段双重推送。
  schedule:
    - cron: '45 23 * * *'   # UTC 23:45 = 北京时间 07:45
  workflow_dispatch:         # 保留手动触发

env:
  # secrets 名与 V44 每日三察一致（已在 GitHub 配置：FEISHU_APP_ID/FEISHU_APP_SECRET/FEISHU_BASE_TOKEN）
  FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
  LARK_APP_ID: ${{ secrets.FEISHU_APP_ID }}
  LARK_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
  CHAT_ID: oc_1fe154e172ab04622b7ffa810ac172bc
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  morning-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 云端早报推送（零npm依赖·API直连）
        run: |
          cd scripts
          python morning_report_cloud.py 2>&1 | tee morning_cloud.log

      - name: 上传运行输出（诊断用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-cloud-log
          path: scripts/morning_cloud.log
          retention-days: 3

      - name: 失败告警到总控群
        if: failure()
        run: |
          cd scripts
          python alert_fail.py "「V16早报·云端永续」云端任务执行失败，请到 Actions 页查看日志" || true
        env:
          LARK_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CHAT_ID: oc_1fe154e172ab04622b7ffa810ac172bc

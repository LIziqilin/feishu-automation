name: Review Derive (复习派生兜底)
on:
  schedule:
    - cron: "7 1 * * *"   # 09:07 北京 = 01:07 UTC（错峰）
  workflow_dispatch:
concurrency:
  group: derive
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
      - name: Run derive
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: python scripts/review_derive.py --rebuild-all
      - name: Retry with jitter (1/5/15min)
        if: failure()
        run: |
          echo "job derive failed at $(date -u +%%H:%%M:%%S) UTC; will be picked by next cycle"

name: Schedule Audit (调度对账)
on:
  schedule:
    - cron: "23 1 1 * *"   # 每月1日 09:23 北京 = 01:23 UTC
  workflow_dispatch:
concurrency:
  group: audit
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
      - name: Run audit
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: python scripts/schedule_audit.py 
      - name: Retry with jitter (1/5/15min)
        if: failure()
        run: |
          echo "job audit failed at $(date -u +%%H:%%M:%%S) UTC; will be picked by next cycle"

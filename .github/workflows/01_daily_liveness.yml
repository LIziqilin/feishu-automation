name: Daily Liveness (早报+活体)
on:
  schedule:
    - cron: "53 23 * * *"   # 07:53 北京 = 23:53 UTC 前一日（错峰）
  workflow_dispatch:
concurrency:
  group: daily_liveness
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  daily_liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
      - name: Run daily_liveness
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python daily_liveness.py 
      - name: Retry with jitter (1/5/15min)
        if: failure()
        run: |
          echo "job daily_liveness failed at $(date -u +%%H:%%M:%%S) UTC; will be picked by next cycle"

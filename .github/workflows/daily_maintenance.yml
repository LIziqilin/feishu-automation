name: V16 日常维护（云端永续·自动备份）

on:
  # P0-A 恢复（2026-10-23）：由 V43"注释停用"改为自动调度。
  # 错峰设计：本地 V16_DailyMaintenance=03:00，云端=03:05（UTC 19:05），避免同段重复写。
  # 云端能力=全表数据备份到 Actions artifact（30天），重算/DLQ/索引等本机逻辑仍由本地任务执行。
  schedule:
    - cron: '5 19 * * *'   # UTC 19:05 = 北京时间 03:05
  workflow_dispatch:         # 保留手动触发

env:
  FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
  LARK_APP_ID: ${{ secrets.FEISHU_APP_ID }}
  LARK_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
  CHAT_ID: oc_1fe154e172ab04622b7ffa810ac172bc
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 云端维护：全表备份（零npm依赖·API直连）
        run: |
          cd scripts
          python daily_maintenance_cloud.py 2>&1 | tee maintenance_cloud.log

      - name: 上传备份文件（30天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cloud-backup
          path: backups/cloud_*/
          retention-days: 30

      - name: 上传运行输出（诊断用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-cloud-log
          path: scripts/maintenance_cloud.log
          retention-days: 3

      - name: 失败告警到总控群
        if: failure()
        run: |
          cd scripts
          python alert_fail.py "「V16维护·云端永续」云端任务执行失败，请到 Actions 页查看日志" || true
        env:
          LARK_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CHAT_ID: oc_1fe154e172ab04622b7ffa810ac172bc

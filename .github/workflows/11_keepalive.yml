name: Keepalive (防60天停用)
on:
  schedule:
    - cron: "11 1 1 * *"   # 每月1日 09:11 北京 = 01:11 UTC
  workflow_dispatch:
concurrency:
  group: keepalive
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
      - name: Run keepalive
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: python scripts/keepalive.py 
      - name: Retry with jitter (1/5/15min)
        if: failure()
        run: |
          echo "job keepalive failed at $(date -u +%%H:%%M:%%S) UTC; will be picked by next cycle"

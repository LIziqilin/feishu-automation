name: DLQ Consumer (死信消费)
on:
  schedule:
    - cron: "43 0 * * *"   # 08:43 北京 = 00:43 UTC（错峰）
  workflow_dispatch:
concurrency:
  group: dlq
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  dlq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
      - name: Run dlq
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python dlq_consumer.py --no-popup
      - name: Retry with jitter (1/5/15min)
        if: failure()
        run: |
          echo "job dlq failed at $(date -u +%%H:%%M:%%S) UTC; will be picked by next cycle"

name: 每日早报-西安天气+学习内容推送

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0:00 = 北京时间8:00
  workflow_dispatch:  # 支持手动触发

env:
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
  WEATHER_CITY: xian

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests feedparser

      - name: 抓取西安天气
        run: python scripts/fetch_weather.py
        continue-on-error: true

      - name: 抓取学习类内容
        run: python scripts/fetch_learning_content.py
        continue-on-error: true

      - name: 生成每日早报并推送
        run: python scripts/push_daily_digest.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-output
          path: |
            weather_data.json
            learning_articles.json
            daily_digest.txt
          retention-days: 7

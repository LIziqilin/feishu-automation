name: webapi on-demand
# 关机后可用的云端问答：外部/手动触发 -> 云端 runner 调 DeepSeek -> 答案推回飞书总控群
on:
  repository_dispatch:
    types: [ask, webhook]
  workflow_dispatch:
    inputs:
      action:
        description: "ask / webhook"
        default: ask
      q:
        description: "问题（ask时）"
        default: "云端连通性测试"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ask -> DeepSeek -> 推飞书群
        if: (github.event.client_payload.action == 'ask') || (inputs.action == 'ask')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CHAT_ID: "oc_1fe154e172ab04622b7ffa810ac172bc"
          Q: ${{ github.event.client_payload.q || inputs.q }}
        run: python .github/workflows/ask_cloud.py
      - name: webhook -> 推飞书群
        if: (github.event.client_payload.action == 'webhook') || (inputs.action == 'webhook')
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CHAT_ID: "oc_1fe154e172ab04622b7ffa810ac172bc"
          TITLE: ${{ github.event.client_payload.title || '云端事件' }}
          TEXT: ${{ github.event.client_payload.text || '来自 on-demand webhook' }}
        run: python -c "import urllib.request,json,os;
import urllib.request as u;
tid=json.load(u.urlopen(u.Request('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',data=json.dumps({'app_id':os.environ['FEISHU_APP_ID'],'app_secret':os.environ['FEISHU_APP_SECRET']}).encode(),headers={'Content-Type':'application/json'})))['tenant_access_token'];
body={'receive_id':os.environ['CHAT_ID'],'msg_type':'text','content':json.dumps({'text':os.environ['TITLE']+chr(10)+os.environ['TEXT']})};
req=u.Request('https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+tid,'Content-Type':'application/json'});
print(u.urlopen(req).read().decode())"

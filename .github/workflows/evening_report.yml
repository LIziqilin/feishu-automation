name: V16 云端晚报（P1-4 备援）

on:
  # 北京 20:30 = UTC 12:30；与本地晚间维护错峰
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:      # 保留手动触发

env:
  FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
  LARK_APP_ID: ${{ secrets.FEISHU_APP_ID }}
  LARK_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
  CHAT_ID: oc_1fe154e172ab04622b7ffa810ac172bc
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  evening-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 云端晚报：今日完成+待办+复习统计
        run: |
          cd scripts
          python evening_report_cloud.py 2>&1 | tee evening_report.log

      - name: 上传运行输出（诊断用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evening-report-log
          path: scripts/evening_report.log
          retention-days: 3

      - name: 失败告警到总控群
        if: failure()
        run: |
          cd scripts
          python alert_fail.py "「V16晚报·云端」云端晚报任务执行失败，请到 Actions 页查看日志" || true
        env:
          LARK_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CHAT_ID: oc_1fe154e172ab04622b7ffa810ac172bc
